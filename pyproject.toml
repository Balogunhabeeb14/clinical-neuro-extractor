[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-neuro-extractor"
version = "0.1.0"
description = "Tools for extracting and organizing neuropsychological patient data"
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
llm = [
    "anthropic>=0.40",
    "pydantic>=2",
]
web = [
    "flask>=3.0",
    "gunicorn>=21",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
